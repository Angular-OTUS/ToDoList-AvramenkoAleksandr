<li
  [classList]="this.itemClass()"
  (click)="onSelectItem(id())"
  (dblclick)="$event.stopPropagation(); onDoubleClick()"
>
  <input
    name="isCompleted"
    type="checkbox"
    [checked]="isCompleted()"
    (change)="$event.stopPropagation(); onCheckboxChange($event)"
  />

  @if (isEditing()) {
    <input
      #editInput
      class="edit-input"
      type="text"
      [(ngModel)]="editText"
      (keyup.enter)="onSave()"
      (keyup.escape)="onCancel()"
    />
    <div class="edit-actions">
      <button
        class="save-btn"
        type="button"
        [disabled]="!editText.trim()"
        (click)="onSave()"
      >
        Save
      </button>
      <button class="cancel-btn" type="button" (click)="onCancel()">
        Cancel
      </button>
    </div>
  } @else {
    <a [routerLink]="[id()]">
      <span class="todo-text">{{ index() }}. {{ text() }}</span>

      <app-button
        appTooltip="Delete the item"
        type="delete"
        (clicked)="onDeleteItem(); $event.stopPropagation()"
        >Delete</app-button
      >
    </a>
  }
</li>
