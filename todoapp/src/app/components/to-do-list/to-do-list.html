<div class="container">
  <div class="title"><h1>Todo List</h1></div>
  @if (isLoading) {
    <div class="spinner-text">Loading todo items...</div>
    <mat-spinner class="loading-items-spinner" diameter="40" />
  } @else {
    <div class="flex_container">
      <div class="left_column">
        <div id="task_list">
          <ul>
            @for (item of items; track item.id) {
              <app-to-do-list-item
                [id]="item.id"
                [text]="item.text"
                (deleteItem)="onDeleteItem($event)"
              />
            }
          </ul>
        </div>
      </div>
      <div class="right_column">
        <mat-form-field>
        <mat-label>Description</mat-label>
        <textarea
          #currentItemDescription
          class="text_edit"
          id="currentItemDescription"
          matInput
          placeholder="Selected item description"
          readonly
        ></textarea>
      </mat-form-field>
      </div>
    </div>
  }
  <div id="new_task">
    <div class="input_section">
      <div>
        <mat-form-field>
          <mat-label>New to-do item text</mat-label>
          <input
            #newItemText
            class="text_edit"
            id="newItemText"
            matInput
            type="text"
          />
        </mat-form-field>
      </div>
      <div>
        <mat-form-field>
          <mat-label>New Item Description</mat-label>
          <textarea
            #newItemDescription
            class="text_edit"
            id="newItemDescription"
            matInput
            placeholder="Enter a detailed description"
          ></textarea>
        </mat-form-field>
      </div>

      <app-button
        #addItemButton
        appTooltip="Add a new item"
        id="addItemButton"
        title="Add my super task"
        type="add"
        [isEnabled]="isAddButtonEnabled()"
        (clicked)="onAddItem()"
      />
    </div>
  </div>
  <div class="footer"></div>
</div>
