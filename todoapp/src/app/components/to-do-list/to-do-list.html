<div class="container">
  <div class="title"><h1>Todo List</h1></div>
  @if (isLoading) {
    <div class="spinner-text">Loading todo items...</div>
    <mat-spinner class="loading-items-spinner" diameter="40" />
  } @else {
    <div id="task_list">
      <ul>
        @for (item of items; track item.id) {
          <app-to-do-list-item
            [id]="item.id"
            [text]="item.text"
            (deleteItem)="onDeleteItem($event)"
          />
        }
      </ul>
    </div>
  }
  <div id="new_task">
    <div class="input_section">
      <mat-form-field>
        <mat-label>New to-do item text</mat-label>
        <input
          #newItemText
          class="text_edit"
          id="newItemDescription"
          matInput
          type="text"
        />
      </mat-form-field>

      <app-button
        #addItemButton
        id="addItemButton"
        title="Add task"
        type="add"
        [isEnabled]="isAddButtonEnabled()"
        (clicked)="onAddItem()"
      />
    </div>
  </div>
  <div class="footer"></div>
</div>
