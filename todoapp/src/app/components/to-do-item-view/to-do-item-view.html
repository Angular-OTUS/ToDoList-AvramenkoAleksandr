<h2>Task</h2>
<div class="input-group">
  <input
    class="todo-text"
    id="itemText"
    matInput
    readonly
    type="text"
    [value]="itemText()"
  />
</div>
<h2>Description</h2>
<textarea
  #currentItemDescription
  class="description-textarea"
  id="todoDescription"
  matInput
  placeholder="Select a todo item to view its description"
  readonly
>
  {{ itemDescription() }}
</textarea>
